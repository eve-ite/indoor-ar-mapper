<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>AR Navigate</title>
  <style>
    :root {
      --bg: #101418;
      --fg: #eef2f5;
      --muted: #9aa7b2;
      --accent: #2bc4a8;
      --route: #f2b84b;
      --warn: #f2b84b;
      --bad: #ef6b6b;
      --btn: #222a31;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.4 system-ui, -apple-system, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body.in-ar { background: transparent; }
    #overlay { min-height: 100%; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    body.in-ar #overlay { justify-content: space-between; }
    h1 { font-size: 20px; margin: 0; }
    body.in-ar .hide-in-ar { display: none !important; }
    body:not(.in-ar) .ar-only { display: none !important; }
    .field {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--btn);
      border-radius: 12px;
      padding: 12px 14px;
    }
    .field > span { flex: none; width: 4.2em; color: var(--muted); }
    .field select {
      flex: 1;
      min-width: 0;
      font: inherit;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #33404a;
      background: var(--bg);
      color: var(--fg);
    }
    .toggle { display: flex; align-items: center; gap: 12px; background: var(--btn); border-radius: 12px; padding: 12px 14px; }
    .toggle input { width: 26px; height: 26px; accent-color: var(--accent); flex: none; }
    .toggle small { display: block; color: var(--muted); font-size: 13px; }
    #map {
      width: 100%;
      height: 46vh;
      min-height: 240px;
      background: #0b0e11;
      border-radius: 12px;
      display: block;
      touch-action: manipulation;
    }
    .maprow { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 14px; }
    .maprow span { flex: 1; }
    .maprow button { font-size: 14px; padding: 8px 12px; border-radius: 8px; }
    #steps { margin: 0; padding-left: 22px; }
    #steps li { margin: 2px 0; }
    #msg { color: var(--muted); margin: 0; }
    #msg.warn { color: var(--warn); }
    #msg.bad { color: var(--bad); }
    button {
      font: 600 20px system-ui, sans-serif;
      padding: 18px 10px;
      border: 0;
      border-radius: 14px;
      background: var(--btn);
      color: var(--fg);
      touch-action: manipulation;
    }
    button:disabled { opacity: 0.35; }
    button.primary { background: var(--accent); color: #062a24; }
    button.stop { background: var(--bad); color: #2a0606; }
    .tip { color: var(--muted); font-size: 14px; margin: 0; }

    /* ---- AR HUD ---- */
    #banner {
      display: flex;
      align-items: center;
      gap: 14px;
      border-radius: 16px;
      padding: 12px 16px;
      background: rgba(0, 0, 0, 0.62);
    }
    #arrow {
      flex: none;
      width: 64px;
      height: 64px;
      transition: transform 0.15s linear;
    }
    #turnText { font: 700 26px/1.2 system-ui, sans-serif; }
    #turnText small { display: block; font: 400 16px system-ui, sans-serif; color: var(--muted); margin-top: 2px; }
    #banner.ok #turnText { color: var(--accent); }
    #banner.warn #turnText { color: var(--warn); }
    #banner.bad #turnText { color: var(--bad); }
    #bottom { display: flex; flex-direction: column; gap: 10px; }
    #info {
      background: rgba(0, 0, 0, 0.55);
      border-radius: 12px;
      padding: 10px 14px;
      font: 15px/1.5 ui-monospace, Menlo, Consolas, monospace;
      white-space: pre-wrap;
    }
    .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .row button { font-size: 17px; padding: 14px 4px; background: rgba(34, 42, 49, 0.85); }
    #here { width: 100%; }
  </style>
</head>
<body>
  <div id="overlay">
    <h1 class="hide-in-ar">Indoor AR Mapper · navigate</h1>

    <div class="hide-in-ar" style="display: flex; flex-direction: column; gap: 10px">
      <label class="field"><span>Map</span><select id="mapPick"></select></label>
      <label class="field"><span>Start</span><select id="startPick"></select></label>
      <label class="field"><span>Go to</span><select id="destPick"></select></label>
    </div>
    <canvas id="map" class="hide-in-ar"></canvas>
    <div class="maprow hide-in-ar">
      <span id="routeInfo">loading…</span>
      <button id="fitBtn" type="button">Whole map</button>
    </div>
    <p class="tip hide-in-ar">
      Tap the map to drop a destination pin. The green arrow is where you start: stand there facing
      the way it points.
    </p>
    <ol id="steps" class="hide-in-ar"></ol>
    <p id="msg"></p>
    <button id="startAr" class="primary hide-in-ar" disabled>Start AR navigation</button>
    <label class="toggle hide-in-ar">
      <input id="recordToggle" type="checkbox" checked />
      <span>Add this walk to the map <small>(records like a scan; it joins the map once uploaded)</small></span>
    </label>
    <div class="hide-in-ar">
      <h2 class="tip">Walks saved on this phone (not uploaded yet)</h2>
      <div id="saved" class="tip">none</div>
    </div>

    <div id="banner" class="ar-only">
      <svg id="arrow" viewBox="-50 -50 100 100" aria-hidden="true">
        <path d="M0 -42 L30 -6 L12 -6 L12 40 L-12 40 L-12 -6 L-30 -6 Z" fill="currentColor" />
      </svg>
      <div id="turnText">Starting…</div>
    </div>
    <div id="bottom" class="ar-only">
      <div id="info"></div>
      <button id="here" class="primary">I'm here</button>
      <div id="nudges" class="row" hidden>
        <button id="nudgeL" type="button" title="Turn the map left">⟲ 2°</button>
        <button id="nudgeR" type="button" title="Turn the map right">2° ⟳</button>
        <button id="nudgeF" type="button" title="Shift the map ahead">↑ 20cm</button>
        <button id="nudgeB" type="button" title="Shift the map back">↓ 20cm</button>
      </div>
      <button id="stop" class="stop">Stop</button>
    </div>
  </div>
  <script type="module" src="./nav.js"></script>
</body>
</html>

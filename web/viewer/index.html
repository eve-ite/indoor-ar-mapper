<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Map Viewer</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --panel: #ffffff;
      --fg: #1b2026;
      --muted: #66717c;
      --line: #dde1e6;
      --accent: #12917b;
      --bad: #c94444;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101418;
        --panel: #181e24;
        --fg: #e8edf1;
        --muted: #8e9aa5;
        --line: #2a333b;
        --accent: #2bc4a8;
        --bad: #ef6b6b;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font: 14px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      display: grid;
      grid-template-columns: 300px 1fr;
      height: 100vh;
    }
    aside {
      background: var(--panel);
      border-right: 1px solid var(--line);
      padding: 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    h1 { font-size: 16px; margin: 0; }
    h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 6px; }
    #scans { display: flex; flex-direction: column; gap: 4px; max-height: 220px; overflow-y: auto; }
    #scans button {
      text-align: left;
      background: transparent;
      color: var(--fg);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 8px;
      font: inherit;
      cursor: pointer;
    }
    #scans button.active { border-color: var(--accent); }
    #scans .meta { color: var(--muted); font-size: 12px; }
    #drop {
      border: 2px dashed var(--line);
      border-radius: 10px;
      padding: 14px;
      text-align: center;
      color: var(--muted);
      cursor: pointer;
    }
    #drop.over { border-color: var(--accent); color: var(--accent); }
    label.slider { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin-bottom: 8px; }
    label.slider input { grid-column: span 2; width: 100%; accent-color: var(--accent); }
    label.slider output { font-variant-numeric: tabular-nums; color: var(--muted); }
    label.check { display: flex; gap: 6px; align-items: center; margin-bottom: 4px; }
    #stats { font: 12px/1.5 ui-monospace, Consolas, monospace; white-space: pre-wrap; color: var(--muted); }
    #err { color: var(--bad); }
    main { position: relative; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; cursor: grab; }
    canvas:active { cursor: grabbing; }
    #hint { position: absolute; right: 12px; bottom: 10px; color: var(--muted); font-size: 12px; pointer-events: none; }
    .legend { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; color: var(--muted); }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
    @media (max-width: 700px) {
      body { grid-template-columns: 1fr; grid-template-rows: auto 60vh; height: auto; }
      aside { border-right: 0; border-bottom: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <aside>
    <h1>Indoor AR Mapper · viewer</h1>
    <section>
      <h2>Scans on server</h2>
      <div id="scans">loading…</div>
    </section>
    <section>
      <h2>Or a local file</h2>
      <div id="drop">Drop a .jsonl here or click to pick</div>
      <input id="file" type="file" accept=".jsonl,.json,.txt" hidden />
    </section>
    <section>
      <h2>Grid</h2>
      <label class="slider">Floor: below (m above floor) <output id="floorMaxV"></output>
        <input id="floorMax" type="range" min="0" max="0.5" step="0.01" /></label>
      <label class="slider">Wall band: from (m above floor) <output id="wallMinV"></output>
        <input id="wallMin" type="range" min="0.05" max="1.5" step="0.01" /></label>
      <label class="slider">Wall band: to (m above floor) <output id="wallMaxV"></output>
        <input id="wallMax" type="range" min="0.3" max="3" step="0.05" /></label>
      <label class="slider">Ray clears below (m) <output id="clearBelowV"></output>
        <input id="clearBelow" type="range" min="0.1" max="2.5" step="0.05" /></label>
      <label class="slider">Max range (m) <output id="maxRangeV"></output>
        <input id="maxRange" type="range" min="1" max="10" step="0.5" /></label>
    </section>
    <section>
      <h2>Layers</h2>
      <label class="check"><input id="showGrid" type="checkbox" checked /> occupancy grid</label>
      <label class="check"><input id="showPts" type="checkbox" checked /> hit points</label>
      <label class="check"><input id="showTraj" type="checkbox" checked /> trajectory</label>
      <div class="legend">
        <span><i style="background:#3b82f6"></i>floor hit</span>
        <span><i style="background:#f97316"></i>wall hit</span>
        <span><i style="background:#9ca3af"></i>other</span>
        <span><i style="background:#e11d48"></i>path</span>
      </div>
    </section>
    <section>
      <h2>Stats</h2>
      <div id="stats">no scan loaded</div>
      <div id="err"></div>
    </section>
  </aside>
  <main>
    <canvas id="map"></canvas>
    <div id="hint">drag to pan · wheel to zoom · double-click to fit · −Z is up</div>
  </main>
  <script type="module" src="./viewer.js"></script>
</body>
</html>
